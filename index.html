<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOODPICKER ITF</title>

  <!-- Google Fonts (Prompt - รองรับภาษาไทย) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Prompt', 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 100%);
      min-height: 100vh;
      color: #0f172a;
    }

    /* ======================= Navbar ======================= */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 24px;
      background: linear-gradient(90deg, #0284c7, #1e3a8a); /* สีฟ้า / น้ำเงิน */
      border-radius: 0 0 24px 24px;
      box-shadow: 0 10px 24px rgba(30, 58, 138, 0.35);
      z-index: 100;
    }

    .nav-left {
      justify-self: start;
      color: #ffffff;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .nav-center {
      justify-self: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 1px;
    }

    .nav-right {
      justify-self: end;
      color: #ffffff;
      font-weight: 600;
      font-size: 1.05rem;
    }

    /* ======================= Layout ======================= */
    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 88px 16px 48px;
    }

    /* ======================= Food Card ======================= */
    .card {
      width: min(92%, 460px);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 24px 48px rgba(2, 132, 199, 0.18), 0 4px 12px rgba(0, 0, 0, 0.08);
      padding: 20px;
      animation: cardIn 0.45s ease;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .card h2 {
      margin-top: 16px;
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
    }

    .card .desc {
      margin-top: 8px;
      color: #64748b;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .card .price {
      margin-top: 10px;
      color: #0284c7;
      font-weight: 700;
      font-size: 1.4rem;
    }

    /* ======================= Random Button ======================= */
    #randomBtn {
      margin-top: 18px;
      width: 100%;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #0ea5e9, #0284c7);
      color: #ffffff;
      font-family: 'Prompt', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 999px;
      box-shadow: 0 8px 16px rgba(2, 132, 199, 0.35);
      transition: all 0.25s ease;
    }

    #randomBtn:hover {
      background: linear-gradient(90deg, #0284c7, #0369a1);
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(2, 132, 199, 0.45);
    }

    #randomBtn:active {
      transform: translateY(0) scale(0.98);
    }

    /* ======================= Responsive ======================= */
    @media (max-width: 480px) {
      .navbar { height: 60px; padding: 0 14px; }
      .nav-center { font-size: 1rem; }
      .nav-left, .nav-right { font-size: 0.9rem; }
      .container { padding: 76px 12px 36px; }
      .card img { height: 180px; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">69070251</div>
    <div class="nav-center">FOODPICKER ITF</div>
    <div class="nav-right">Week15</div>
  </header>

  <!-- แสดงผลเมนูอาหาร -->
  <main class="container">
    <section class="card" id="foodCard">
      <img id="foodImage" src="https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=800&q=80" alt="ข้าวมันไก่" />
      <h2 id="foodName">ข้าวมันไก่</h2>
      <p class="desc" id="foodDesc">น้ำจิ้มเด็ด น้ำซุปโฮกกลมกล่อม</p>
      <p class="price" id="foodPrice">50-65 บาท</p>
      <button id="randomBtn">สุ่มเมนูอาหาร</button>
    </section>
  </main>

  <script>
    // ======================= ข้อมูลเมนูอาหาร (อย่างน้อย 5 รายการ) =======================
    const foods = [
      {
        name: "ข้าวมันไก่",
        desc: "น้ำจิ้มเด็ด น้ำซุปโฮกกลมกล่อม",
        price: "50-65 บาท",
        image: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=800&q=80"
      },
      {
        name: "พิซซ่า",
        desc: "ซอสเปปเปสโอ อบอิสานกรอบ",
        price: "80-120 บาท",
        image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=80"
      },
      {
        name: "เบเกอีสไลด์",
        desc: "เนื้อสัตว์ juicy ราดซอสเข้มข้น",
        price: "70-90 บาท",
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80"
      },
      {
        name: "ผัดไทย",
        desc: "น้ำซุปเข้มข้น กุ้งแห้งกรอบ",
        price: "45-60 บาท",
        image: "https://images.unsplash.com/photo-1559314809-0d155014e29e?auto=format&fit=crop&w=800&q=80"
      },
      {
        name: "ซุบอกแซลมอน",
        desc: "ซอสโอะ มะลิ เก๋วกรอบ",
        price: "90-110 บาท",
        image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=800&q=80"
      },
      {
        name: "สลัดผัก",
        desc: "ผักใส่เนื้อต้มย่าง ราดน้ำปูเสิร์ฟ",
        price: "60-80 บาท",
        image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80"
      }
    ];

    // ======================= จัดการการแสดงผล =======================
    const card = document.getElementById('foodCard');
    const img = document.getElementById('foodImage');
    const nameEl = document.getElementById('foodName');
    const descEl = document.getElementById('foodDesc');
    const priceEl = document.getElementById('foodPrice');

    function renderFood(item) {
      img.src = item.image;
      img.alt = item.name;
      nameEl.textContent = item.name;
      descEl.textContent = item.desc;
      priceEl.textContent = item.price;
    }

    function randomFood() {
      const item = foods[Math.floor(Math.random() * foods.length)];
      renderFood(item);
      // ทำให้การ์ด animate ใหม่ทุกครั้งที่สุ่ม
      card.classList.remove('animate');
      void card.offsetWidth; // trigger reflow เพื่อ restart animation
      card.classList.add('animate');
    }

    document.getElementById('randomBtn').addEventListener('click', randomFood);

    // ======================= แสดงเมนูเริ่มต้น =======================
    renderFood(foods[0]);
  </script>
</body>
</html>
